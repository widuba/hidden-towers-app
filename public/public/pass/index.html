<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <title>Hidden Towers – Player Pass</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --purple: #7c3aed;
      --purple2: #a78bfa;
      --gold: #f59e0b;
      --gold2: #fbbf24;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: rgba(255,255,255,.12);
      --card: rgba(255,255,255,.06);
      --bg: #0a0718;
      --red: #f87171;
      --green: #6ee7b7;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      min-height: 100%;
      overflow-x: hidden !important;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior-x: none;
      overscroll-behavior-y: contain;
      scrollbar-width: none;
      touch-action: manipulation;
      background: var(--bg);
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    body {
      font-family: 'Nunito', sans-serif;
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding:
        calc(env(safe-area-inset-top) + 74px)
        max(14px, env(safe-area-inset-right))
        calc(env(safe-area-inset-bottom) + 56px)
        max(14px, env(safe-area-inset-left));
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(124,58,237,.28) 0%, transparent 70%),
        radial-gradient(ellipse 60% 35% at 15% 65%, rgba(59,130,246,.12) 0%, transparent 65%),
        radial-gradient(ellipse 60% 35% at 90% 90%, rgba(245,158,11,.08) 0%, transparent 60%);
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .35;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.75) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.45) 1px, transparent 1px);
      background-size: 340px 340px, 220px 220px;
      background-position: 0 0, 80px 110px;
      z-index: 0;
    }

    body > * {
      position: relative;
      z-index: 1;
    }

    button,
    a,
    .pass,
    .lookup-box,
    .override-box,
    .qr-wrap,
    .btn {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    input,
    textarea,
    [contenteditable="true"] {
      -webkit-user-select: text;
      user-select: text;
      touch-action: manipulation;
      font-size: 16px !important;
    }

    .top-bar {
      width: 100%;
      max-width: 460px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 44px;
    }

    .back-btn {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 14px;
      background: rgba(255,255,255,.08);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 16px;
      cursor: pointer;
      text-decoration: none;
      transition: background .15s, transform .15s, border-color .15s;
      flex-shrink: 0;
    }

    .back-btn:hover {
      background: rgba(255,255,255,.14);
      border-color: rgba(167,139,250,.35);
    }

    .back-btn:active {
      transform: scale(.98);
    }

    .page-title {
      font-family: 'Fredoka One', cursive;
      font-weight: 400;
      font-size: clamp(24px, 6vw, 36px);
      line-height: 1.1;
      background: linear-gradient(135deg, var(--gold2), #f472b6, var(--purple2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lookup-box {
      width: 460px;
      max-width: 100%;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 18px 50px rgba(0,0,0,.22);
    }

    .lookup-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .lookup-label {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .lookup-input {
      font-family: 'Fredoka One', cursive;
      font-weight: 400;
      font-size: 20px !important;
      letter-spacing: .12em;
      background: rgba(0,0,0,.35);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      padding: 11px 14px;
      outline: none;
      text-transform: uppercase;
      width: 100%;
      transition: border-color .15s, box-shadow .15s;
    }

    .lookup-input:focus {
      border-color: var(--purple2);
      box-shadow: 0 0 0 3px rgba(167,139,250,.18);
    }

    .lookup-input::placeholder {
      color: rgba(255,255,255,.25);
      font-size: 15px;
      letter-spacing: .05em;
    }

    .lookup-input[readonly] {
      opacity: .72;
      cursor: not-allowed;
      border-color: rgba(255,255,255,.07);
    }

    #lookupStatus,
    #overrideStatus {
      font-size: 13px;
      font-weight: 900;
      min-height: 18px;
      color: var(--muted);
      line-height: 1.35;
    }

    .controls {
      width: 460px;
      max-width: 100%;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 15px;
      padding: 11px 22px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: opacity .15s, transform .15s, background .15s;
    }

    .btn:hover {
      opacity: .9;
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--purple), #4f46e5);
      color: #fff;
      box-shadow: 0 5px 18px rgba(124,58,237,.32);
    }

    .hint {
      font-size: 13px;
      color: var(--muted);
      font-weight: 800;
      text-align: center;
      max-width: 460px;
      line-height: 1.45;
      padding: 0 6px;
    }

    .pass {
      width: 460px;
      max-width: 100%;
      background: linear-gradient(145deg, #13093a 0%, #1a0f4a 60%, #0e1a3a 100%);
      border: 1.5px solid rgba(167,139,250,.35);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(167,139,250,.1), 0 20px 60px rgba(0,0,0,.55);
    }

    .pass-stripe {
      height: 8px;
      background: linear-gradient(90deg, #7c3aed, #a78bfa, #f59e0b, #a78bfa, #7c3aed);
    }

    .pass-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--border);
    }

    .pass-logo {
      font-family: 'Fredoka One', cursive;
      font-size: 30px;
      color: var(--gold2);
      line-height: 1;
      flex-shrink: 0;
    }

    .pass-title {
      font-family: 'Fredoka One', cursive;
      font-weight: 400;
      font-size: 19px;
      color: var(--text);
      line-height: 1.1;
    }

    .pass-subtitle {
      font-size: 11px;
      font-weight: 900;
      color: var(--muted);
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .pass-tournament-code {
      font-family: 'Fredoka One', cursive;
      font-weight: 400;
      font-size: 15px;
      color: var(--gold2);
      letter-spacing: .1em;
      text-align: right;
      max-width: 125px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pass-tournament-label {
      font-size: 10px;
      font-weight: 900;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      text-align: right;
      white-space: nowrap;
    }

    .pass-body {
      display: flex;
    }

    .pass-fields {
      flex: 1;
      min-width: 0;
      padding: 18px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .pass-field {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .pass-field-label {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .pass-field-value {
      font-size: 16px;
      font-weight: 900;
      color: var(--text);
      min-height: 26px;
      word-break: break-word;
    }

    .pass-field-value.editable {
      border-bottom: 1.5px solid rgba(167,139,250,.25);
      padding-bottom: 2px;
      outline: none;
      background: transparent;
      font-family: 'Nunito', sans-serif;
    }

    .pass-field-value.editable:focus {
      border-bottom-color: var(--purple2);
    }

    .pass-field-value.editable::after {
      content: " ✏";
      font-size: 11px;
      opacity: .45;
    }

    .pass-field-value.editable:focus::after {
      display: none;
    }

    .pass-field-value.id-value {
      font-family: 'Fredoka One', cursive;
      font-weight: 400;
      font-size: 22px;
      color: var(--gold2);
      letter-spacing: .12em;
    }

    .pass-qr-col {
      padding: 18px 20px 20px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .qr-wrap {
      width: 164px;
      height: 164px;
      background: #fff;
      border-radius: 12px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #qrImg {
      display: block;
      width: 148px;
      height: 148px;
      border-radius: 4px;
      object-fit: contain;
    }

    .qr-label {
      font-size: 10px;
      font-weight: 900;
      color: var(--muted);
      letter-spacing: .06em;
      text-transform: uppercase;
      text-align: center;
    }

    .pass-footer {
      border-top: 1px solid var(--border);
      padding: 12px 22px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .pass-url-label {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .pass-url {
      font-size: 12px;
      font-weight: 800;
      color: #a78bfa;
      word-break: break-all;
      line-height: 1.35;
    }

    .pass-stripe-bottom {
      height: 5px;
      background: linear-gradient(90deg, #f59e0b, #a78bfa, #7c3aed, #a78bfa, #f59e0b);
      opacity: .65;
    }

    .override-box {
      width: 460px;
      max-width: 100%;
      background: rgba(255,255,255,.045);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .override-label {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1.35;
    }

    .override-input {
      font-family: 'Nunito', sans-serif;
      font-size: 16px !important;
      font-weight: 800;
      background: rgba(0,0,0,.35);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      padding: 10px 12px;
      outline: none;
      width: 100%;
      transition: border-color .15s, box-shadow .15s;
    }

    .override-input:focus {
      border-color: var(--purple2);
      box-shadow: 0 0 0 3px rgba(167,139,250,.18);
    }

    @media (max-width: 560px) {
      body {
        gap: 14px;
        padding:
          calc(env(safe-area-inset-top) + 82px)
          max(10px, env(safe-area-inset-right))
          calc(env(safe-area-inset-bottom) + 58px)
          max(10px, env(safe-area-inset-left));
      }

      .top-bar {
        gap: 8px;
      }

      .back-btn {
        padding: 8px 13px;
        font-size: 13px;
      }

      .page-title {
        font-size: clamp(23px, 6vw, 32px);
      }

      .lookup-box,
      .override-box {
        padding: 15px;
      }

      .pass-header {
        padding: 16px;
        gap: 10px;
      }

      .pass-title {
        font-size: 17px;
      }

      .pass-subtitle {
        font-size: 10px;
      }

      .pass-body {
        flex-direction: column;
      }

      .pass-fields {
        padding: 16px;
      }

      .pass-qr-col {
        padding: 0 16px 18px;
      }

      .qr-wrap {
        width: 162px;
        height: 162px;
      }

      .pass-tournament-code {
        font-size: 13px;
        max-width: 96px;
      }

      .pass-tournament-label {
        font-size: 9px;
      }

      .controls .btn {
        width: 100%;
      }
    }

    @media print {
      html,
      body {
        background: #fff !important;
        padding: 0 !important;
        gap: 0 !important;
        overflow: visible !important;
      }

      body::before,
      .top-bar,
      .lookup-box,
      .controls,
      .hint,
      .override-box {
        display: none !important;
      }

      .pass {
        width: 100%;
        max-width: 480px;
        box-shadow: none;
        border-color: #ccc;
        background: #fff;
        color: #000;
        border-radius: 12px;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .pass-stripe,
      .pass-stripe-bottom {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .pass-field-value {
        color: #111;
      }

      .pass-field-value.editable {
        border-bottom-color: #bbb;
      }

      .pass-field-value.id-value {
        color: #5b21b6;
      }

      .pass-tournament-code,
      .pass-logo {
        color: #92400e;
      }

      .pass-title {
        color: #111;
      }

      .pass-subtitle,
      .pass-url-label,
      .qr-label,
      .pass-field-label,
      .pass-tournament-label {
        color: #666;
      }

      .pass-url {
        color: #5b21b6;
      }

      .qr-wrap {
        background: #fff;
        border: 1px solid #ddd;
      }

      .pass-field-value.editable::after {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="../index.html" class="back-btn" id="backHomeBtn">← Home</a>
    <h1 class="page-title">🪪 Player Pass</h1>
  </div>

  <div class="lookup-box">
    <div class="lookup-row">
      <div class="lookup-label">Tournament Code</div>
      <input
        id="codeInput"
        class="lookup-input"
        placeholder="ABCDEFGH"
        maxlength="8"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="characters"
        spellcheck="false"
      />
    </div>

    <div class="lookup-row">
      <div class="lookup-label">Player ID</div>
      <input
        id="pidInput"
        class="lookup-input"
        placeholder="Loading…"
        maxlength="8"
        readonly
        autocomplete="off"
        autocorrect="off"
        autocapitalize="characters"
        spellcheck="false"
      />
    </div>

    <div id="lookupStatus"></div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" type="button" id="printBtn">🖨 Print / Save as PDF</button>
  </div>

  <p class="hint" id="pageHint">Loading your player pass…</p>

  <div class="pass">
    <div class="pass-stripe"></div>

    <div class="pass-header">
      <div class="pass-logo">👑</div>
      <div style="flex:1;min-width:0;">
        <div class="pass-title">Hidden Towers</div>
        <div class="pass-subtitle">Tournament Player Pass</div>
      </div>
      <div>
        <div class="pass-tournament-label">Tournament Code</div>
        <div class="pass-tournament-code" id="fieldCode">—</div>
      </div>
    </div>

    <div class="pass-body">
      <div class="pass-fields">

        <div class="pass-field">
          <div class="pass-field-label">Player Name</div>
          <div class="pass-field-value" id="fieldName">—</div>
        </div>

        <div class="pass-field">
          <div class="pass-field-label">Date of Birth</div>
          <div class="pass-field-value editable" contenteditable="true" spellcheck="false" id="fieldDob">MM / DD / YYYY</div>
        </div>

        <div class="pass-field">
          <div class="pass-field-label">Notes</div>
          <div class="pass-field-value editable" contenteditable="true" spellcheck="false" id="fieldNotes"></div>
        </div>

        <div class="pass-field">
          <div class="pass-field-label">Player ID</div>
          <div class="pass-field-value id-value" id="fieldPID">—</div>
        </div>

      </div>

      <div class="pass-qr-col">
        <div class="qr-wrap">
          <img id="qrImg" width="148" height="148" alt="QR code" />
        </div>
        <div class="qr-label">Host scans to add</div>
      </div>
    </div>

    <div class="pass-footer">
      <div class="pass-url-label">Player join link</div>
      <div class="pass-url" id="dispURL">—</div>
    </div>

    <div class="pass-stripe-bottom"></div>
  </div>

  <div class="override-box">
    <div class="override-label">Host Override — Enter Password to Change Player ID</div>
    <input id="overrideInput" class="override-input" type="password" placeholder="Password" />
    <div id="overrideStatus"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      initializeAuth,
      browserLocalPersistence,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      initializeFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    import QRCode from "https://cdn.jsdelivr.net/npm/qrcode@1.5.3/+esm";

    const firebaseConfig = {
      apiKey: "AIzaSyDnLusbSL7Fa-aAceIm3vLE_yRa1R-VajE",
      authDomain: "hidden-towers.firebaseapp.com",
      projectId: "hidden-towers",
      storageBucket: "hidden-towers.firebasestorage.app",
      messagingSenderId: "93909210045",
      appId: "1:93909210045:web:7335ea94fc4a196129f8d4",
      measurementId: "G-SEFMNLV3KH"
    };

    const app = initializeApp(firebaseConfig);

    const auth = initializeAuth(app, {
      persistence: browserLocalPersistence
    });

    const db = initializeFirestore(app, {
      experimentalForceLongPolling: true,
      useFetchStreams: false
    });

    const pidInput = document.getElementById("pidInput");
    const codeInput = document.getElementById("codeInput");
    const status = document.getElementById("lookupStatus");
    const hint = document.getElementById("pageHint");
    const overrideInput = document.getElementById("overrideInput");
    const overrideSt = document.getElementById("overrideStatus");
    const qrImg = document.getElementById("qrImg");
    const fieldCode = document.getElementById("fieldCode");
    const fieldName = document.getElementById("fieldName");
    const fieldPID = document.getElementById("fieldPID");
    const dispURL = document.getElementById("dispURL");

    let currentUser = null;
    let currentProfile = null;

    function setStatus(message, color = "var(--muted)") {
      status.textContent = message;
      status.style.color = color;
    }

    function cleanCode(value) {
      return String(value || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 8);
    }

    function cleanPid(value) {
      return String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
    }

    function currentCode() {
      return cleanCode(codeInput.value);
    }

    function currentPid() {
      return cleanPid(fieldPID.textContent);
    }

    function buildPassUrl(pid) {
      const cleanPlayerId = cleanPid(pid);
      const code = currentCode();

      if (!cleanPlayerId) return "";

      if (code.length === 8) {
        return `${window.location.origin}/index.html?tjoin=${encodeURIComponent(code)}&pid=${encodeURIComponent(cleanPlayerId)}`;
      }

      return `${window.location.origin}/pass/index.html?pid=${encodeURIComponent(cleanPlayerId)}`;
    }

    async function generateQR(pid) {
      const url = buildPassUrl(pid);

      if (!url) {
        qrImg.removeAttribute("src");
        return;
      }

      dispURL.textContent = url;

      try {
        const dataUrl = await QRCode.toDataURL(url, {
          width: 148,
          margin: 1,
          errorCorrectionLevel: "M",
          color: {
            dark: "#000000",
            light: "#ffffff"
          }
        });

        qrImg.src = dataUrl;
      } catch (err) {
        console.error("QR error:", err);
        qrImg.removeAttribute("src");
        dispURL.textContent = url;
        setStatus("QR could not be generated, but the join link is shown below.", "var(--gold2)");
      }
    }

    function updateJoinLink() {
      const pid = currentPid();

      if (!pid) {
        dispURL.textContent = "—";
        qrImg.removeAttribute("src");
        return;
      }

      generateQR(pid);
    }

    function fillPass({ pid, username }) {
      const cleanPlayerId = cleanPid(pid);

      pidInput.value = cleanPlayerId;
      fieldPID.textContent = cleanPlayerId || "—";
      fieldName.textContent = username || "Player";

      updateJoinLink();
    }

    async function lookupPlayer(pid) {
      const cleanPlayerId = cleanPid(pid);

      if (!cleanPlayerId) {
        setStatus("Enter a valid Player ID.", "var(--red)");
        return;
      }

      setStatus("Looking up…", "var(--muted)");

      if (!currentUser) {
        setStatus("Sign in on the main page first, then re-open this page.", "var(--red)");
        return;
      }

      try {
        const snap = await getDoc(doc(db, "playerIds", cleanPlayerId));

        if (!snap.exists()) {
          setStatus("Player ID not found.", "var(--red)");
          fieldName.textContent = "—";
          fieldPID.textContent = "—";
          qrImg.removeAttribute("src");
          dispURL.textContent = "—";
          return;
        }

        const data = snap.data();

        fillPass({
          pid: cleanPlayerId,
          username: data.username || "Player"
        });

        setStatus("✓ Player found", "var(--green)");
        hint.textContent = "Edit Date of Birth and Notes if needed, then print or save as PDF.";
      } catch (err) {
        console.error("Lookup failed:", err);
        setStatus("Could not look up that Player ID. Please try again.", "var(--red)");
      }
    }

    async function loadCurrentUserPass(user, prePid) {
      currentUser = user;

      if (!user) {
        pidInput.placeholder = "Not signed in";
        hint.textContent = "Sign in on the main page first, then return here.";
        setStatus("Not signed in.", "var(--red)");
        fieldName.textContent = "—";
        fieldPID.textContent = "—";
        qrImg.removeAttribute("src");
        dispURL.textContent = "—";
        return;
      }

      try {
        const userSnap = await getDoc(doc(db, "users", user.uid));

        if (!userSnap.exists()) {
          pidInput.placeholder = "No profile";
          hint.textContent = "Your account was found, but your game profile was not found.";
          setStatus("Profile not found.", "var(--red)");
          return;
        }

        currentProfile = userSnap.data();

        const realPlayerId = cleanPid(currentProfile.playerId);
        const pidToUse = cleanPid(prePid || realPlayerId);

        if (!pidToUse) {
          pidInput.placeholder = "No Player ID yet";
          hint.textContent = "No Player ID found for your account. Try returning to the main page.";
          setStatus("No Player ID found.", "var(--red)");
          return;
        }

        if (prePid) {
          pidInput.value = pidToUse;
          await lookupPlayer(pidToUse);
          return;
        }

        fillPass({
          pid: pidToUse,
          username: currentProfile.username || "Player"
        });

        setStatus("✓ Your Player ID is ready", "var(--green)");
        hint.textContent = "Your Player ID has been filled in automatically. Edit Date of Birth and Notes if needed, then print or save as PDF.";
      } catch (err) {
        console.error("Could not load pass:", err);
        pidInput.placeholder = "Error loading";
        hint.textContent = "Could not load your Player ID.";
        setStatus("Could not load your pass. Return home and try again.", "var(--red)");
      }
    }

    overrideInput.addEventListener("input", () => {
      if (overrideInput.value === "123456") {
        pidInput.removeAttribute("readonly");
        pidInput.style.opacity = "";
        pidInput.style.cursor = "";
        pidInput.placeholder = "Enter Player ID";
        overrideSt.textContent = "✓ Player ID field unlocked";
        overrideSt.style.color = "var(--green)";
      } else {
        pidInput.setAttribute("readonly", "");
        pidInput.style.opacity = ".72";
        pidInput.style.cursor = "not-allowed";
        overrideSt.textContent = "";
      }
    });

    pidInput.addEventListener("input", () => {
      if (pidInput.hasAttribute("readonly")) return;

      pidInput.value = cleanPid(pidInput.value);

      if (pidInput.value.length === 8) {
        lookupPlayer(pidInput.value);
      }
    });

    codeInput.addEventListener("input", () => {
      codeInput.value = cleanCode(codeInput.value);
      const code = codeInput.value;

      fieldCode.textContent = code || "—";
      updateJoinLink();
    });

    document.getElementById("printBtn").addEventListener("click", () => {
      window.print();
    });

    document.getElementById("backHomeBtn").addEventListener("click", () => {
      sessionStorage.setItem("hiddenTowersReturningHome", "1");
    });

    const params = new URLSearchParams(window.location.search);
    const preCode = cleanCode(params.get("code") || "");
    const prePid = cleanPid(params.get("pid") || "");

    if (preCode) {
      codeInput.value = preCode;
      fieldCode.textContent = preCode;
    }

    onAuthStateChanged(auth, async (user) => {
      await loadCurrentUserPass(user, prePid);
    });

    let lastTouchEnd = 0;

    document.addEventListener("touchend", function (event) {
      const now = Date.now();

      if (now - lastTouchEnd <= 350) {
        event.preventDefault();
      }

      lastTouchEnd = now;
    }, { passive: false });

    document.addEventListener("gesturestart", function (event) {
      event.preventDefault();
    }, { passive: false });

    document.addEventListener("gesturechange", function (event) {
      event.preventDefault();
    }, { passive: false });

    document.addEventListener("gestureend", function (event) {
      event.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>
