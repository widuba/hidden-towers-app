<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Hidden Towers — A fog-of-war strategy board game">
  <defs>
    <radialGradient id="glow1" cx="22%" cy="30%" r="60%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="55%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="iconbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="icontower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0a0718"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <g fill="#ffffff">
    <circle cx="140" cy="90" r="2" opacity=".7"/>
    <circle cx="320" cy="160" r="1.6" opacity=".5"/>
    <circle cx="980" cy="120" r="2" opacity=".6"/>
    <circle cx="1080" cy="300" r="1.6" opacity=".5"/>
    <circle cx="220" cy="500" r="1.6" opacity=".5"/>
    <circle cx="760" cy="540" r="2" opacity=".6"/>
    <circle cx="1120" cy="520" r="1.4" opacity=".4"/>
  </g>

  <!-- app icon -->
  <g transform="translate(96,250)">
    <rect width="150" height="150" rx="34" fill="url(#iconbg)"/>
    <g fill="url(#icontower)" transform="translate(28,24) scale(1.45)">
      <rect x="20" y="19" width="4" height="9" rx="1"/>
      <rect x="28" y="19" width="4" height="9" rx="1"/>
      <rect x="36" y="19" width="4" height="9" rx="1"/>
      <rect x="20" y="25" width="20" height="26" rx="2"/>
    </g>
    <path d="M68 240" />
  </g>

  <text x="290" y="300" font-family="'Trebuchet MS',Verdana,sans-serif" font-weight="700" font-size="92" fill="url(#title)">Hidden Towers</text>
  <text x="292" y="360" font-family="'Trebuchet MS',Verdana,sans-serif" font-weight="700" font-size="34" fill="#c9c2e8">Reveal the fog. Claim the towers. Outsmart everyone.</text>

  <!-- pills -->
  <g font-family="'Trebuchet MS',Verdana,sans-serif" font-weight="700" font-size="24">
    <g transform="translate(292,400)">
      <rect width="190" height="48" rx="24" fill="#7c3aed" fill-opacity="0.22" stroke="#a78bfa" stroke-opacity="0.45"/>
      <text x="95" y="32" text-anchor="middle" fill="#c4b5fd">2–4 Players</text>
    </g>
    <g transform="translate(498,400)">
      <rect width="160" height="48" rx="24" fill="#f59e0b" fill-opacity="0.18" stroke="#fbbf24" stroke-opacity="0.45"/>
      <text x="80" y="32" text-anchor="middle" fill="#fbbf24">1 vs AI</text>
    </g>
    <g transform="translate(674,400)">
      <rect width="220" height="48" rx="24" fill="#10b981" fill-opacity="0.18" stroke="#34d399" stroke-opacity="0.45"/>
      <text x="110" y="32" text-anchor="middle" fill="#34d399">4 Game Modes</text>
    </g>
  </g>

  <text x="292" y="520" font-family="'Trebuchet MS',Verdana,sans-serif" font-weight="700" font-size="28" fill="#9b93c0">Free on the App Store · iPhone &amp; iPad</text>
</svg>
